<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำหนดกลุ่มเป้าหมาย - โรงพยาบาลพิษณุเวช พิจิตร</title>
  <script>
    (function() {
      const search = window.location.search;
      const extra = search ? '&' + search.substring(1).replace(/view=[^&]*/, '').replace(/^&+/, '').replace(/&+$/, '') : '';
      window.location.replace('admin.html?view=target' + (extra === '&' ? '' : extra));
    })();
  </script>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #475569;">
  <div style="text-align: center;">
    <p>กำลังเปลี่ยนเส้นทางไปยังหน้ากำหนดกลุ่มเป้าหมาย (Native SPA)...</p>
    <p><a href="admin.html?view=target" style="color: #0284c7; text-decoration: underline;">คลิกที่นี่หากไม่มีการเปลี่ยนเส้นทางอัตโนมัติ</a></p>
  </div>
</body>
</html>
