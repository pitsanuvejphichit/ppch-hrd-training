<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงทะเบียนเข้าอบรม | โรงพยาบาลพิษณุเวช พิจิตร</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Prompt', sans-serif; }

    /* CSS Medical Cross Loader (Phitsanuvej Style) */
    .css-logo-loader {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 20px auto 40px;
      transform: scale(1.6);
      transform-origin: center;
    }

    .logo-petal {
      position: absolute;
      animation: loadingPulse 1.6s ease-in-out infinite;
    }

    .logo-petal.outer {
      background: #1e5387; /* สีน้ำเงินเข้มสำหรับกลีบนอก */
      border-radius: 6px;
    }

    .logo-petal.inner {
      background: #5faee3; /* สีน้ำเงินอ่อนสำหรับกลีบใน */
      border-radius: 5px;
    }

    /* ตั้งตำแหน่งแต่ละกลีบของสัญลักษณ์กากบาทแพทย์ */
    .logo-petal.outer.top {
      top: 0px; left: 30px; width: 20px; height: 24px;
      animation-delay: 0s;
    }
    .logo-petal.inner.top-right {
      top: 14px; right: 14px; width: 20px; height: 20px;
      animation-delay: 0.2s;
    }
    .logo-petal.outer.right {
      top: 30px; right: 0px; width: 24px; height: 20px;
      animation-delay: 0.4s;
    }
    .logo-petal.inner.bottom-right {
      bottom: 14px; right: 14px; width: 20px; height: 20px;
      animation-delay: 0.6s;
    }
    .logo-petal.outer.bottom {
      bottom: 0px; left: 30px; width: 20px; height: 24px;
      animation-delay: 0.8s;
    }
    .logo-petal.inner.bottom-left {
      bottom: 14px; left: 14px; width: 20px; height: 20px;
      animation-delay: 1.0s;
    }
    .logo-petal.outer.left {
      top: 30px; left: 0px; width: 24px; height: 20px;
      animation-delay: 1.2s;
    }
    .logo-petal.inner.top-left {
      top: 14px; left: 14px; width: 20px; height: 20px;
      animation-delay: 1.4s;
    }

    /* เอฟเฟกต์การกะพริบไล่ระดับคลื่นแบบวนลูป */
    @keyframes loadingPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.55;
      }
      50% {
        transform: scale(1.18);
        opacity: 1;
      }
    }

    @keyframes loaderPop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <!-- โครงสร้างกล่องหน้าจอโหลดหลัก (Loading Overlay) -->
  <div id="loading" style="position: fixed; inset: 0; background: #f8fafc; display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div class="loader-card" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 48px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.06); min-width: 300px; transform: scale(0.95); animation: loaderPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
      
      <!-- ตัวหมุนแอนิเมชันกากบาทแพทย์ -->
      <div class="css-logo-loader">
        <div class="logo-petal outer top"></div>
        <div class="logo-petal inner top-right"></div>
        <div class="logo-petal outer right"></div>
        <div class="logo-petal inner bottom-right"></div>
        <div class="logo-petal outer bottom"></div>
        <div class="logo-petal inner bottom-left"></div>
        <div class="logo-petal outer left"></div>
        <div class="logo-petal inner top-left"></div>
      </div>
      
      <!-- ข้อความประกอบการรอข้อมูล -->
      <div style="margin-top: 24px; text-align: center;">
        <div style="font-size: 18px; font-weight: 800; color: #1e5387; margin-bottom: 6px; letter-spacing: 0.5px;">
          ระบบลงทะเบียนเข้าอบรม
        </div>
        <div style="font-size: 13px; font-weight: 600; color: #64748b;">
          โรงพยาบาลพิษณุเวช พิจิตร
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const viewParam = urlParams.get('view');
      const savedView = localStorage.getItem('preferred_view');
      
      const isMobileDevice = /Android|webOS|iPhone|iPad|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth < 768);

      let targetView = 'desktop.html';
      if (viewParam === 'mobile') {
        targetView = 'mobile.html';
      } else if (viewParam === 'desktop') {
        targetView = 'desktop.html';
      } else if (savedView === 'mobile') {
        targetView = 'mobile.html';
      } else if (savedView === 'desktop') {
        targetView = 'desktop.html';
      } else if (isMobileDevice) {
        targetView = 'mobile.html';
      }

      const cleanParams = new URLSearchParams(window.location.search);
      cleanParams.delete('view');
      const paramStr = cleanParams.toString();
      const finalUrl = targetView + (paramStr ? '?' + paramStr : '');
      window.location.replace(finalUrl);
    })();
  </script>
</body>
</html>
